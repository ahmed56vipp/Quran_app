name: Flutter Build APK

on:
  push:
    branches:
      - main
      - merge-quran-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required NDK
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

          NDK_PATH="$ANDROID_HOME/ndk/28.2.13676358"

          for attempt in 1 2 3; do
            echo "Installing NDK - attempt $attempt of 3"
            rm -rf "$NDK_PATH"

            if sdkmanager --sdk_root="$ANDROID_HOME" --install "ndk;28.2.13676358" \
              && test -f "$NDK_PATH/source.properties"; then
              echo "NDK installed successfully"
              exit 0
            fi

            echo "NDK installation failed"
            sleep 15
          done

          echo "NDK installation failed after 3 attempts"
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"

          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties

          gradle wrapper --gradle-version 9.1.0 --distribution-type bin

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
